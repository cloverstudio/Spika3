            summary: "Upload file chunk"
            description: "Upload file by chunks"
            operationId: "uploadFilesPOST"
            consumes:
                - "application/json"
            produces:
                - "application/json"
            parameters:
                - in: "body"
                  name: "body"
                  required: true
                  schema:
