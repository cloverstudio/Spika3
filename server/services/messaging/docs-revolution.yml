securityDefinitions:
    api_key:
        type: "apiKey"
        name: "accesstoken"
        in: "header"
definitions:
    User:
        type: "object"
        properties:
            id:
                type: "integer"
                format: "int32"
            displayName:
                type: "string"
                format: "string"
            gender: 
                type: "string"
                format: "string"
            country:
                type: "string"
                format: "string"
            avatarFileId:
                type: "integer"
                format: "int32"
            telephoneNumber:
                type: "string"
                format: "string"
            telephoneNumberHashed:
                type: "string"
                format: "string"
            emailAddress:
                type: "string"
                format: "string"
            createdAt:
                type: "integer"
                format: "int32"
        example:
            createdAt: 1
            emailAddress: "emailAddress"
            telephoneNumber: "telephoneNumber"
            displayName: "displayName"
            avatarFileId: 6
            id: 0
            telephoneNumberHashed: "telephoneNumberHashed"
    Device:
        type: "object"
        properties:
            id:
                type: "integer"
                format: "int32"
            userId:
                type: "integer"
                format: "int32"
            token:
                type: "string"
                format: "string"
            tokenExpiredAt:
                type: "integer"
                format: "int32"
            osName:
                type: "string"
                format: "string"
            osVersion:
                type: "integer"
                format: "int32"
            appVersion:
                type: "integer"
                format: "int32"
            pushToken:
                type: "string"
                format: "string"
        example:
            appVersion: 9
            osVersion: 7
            id: 5
            tokenExpiredAt: 2
            osName: "osName"
            userId: 5
            pushToken: "pushToken"
            token: "token"
    File:
        type: "object"
        properties:
            id:
                type: "integer"
                format: "int32"
            fileName:
                type: "string"
            size:
                type: "integer"
                format: "int32"
            mimeType:
                type: "string"
            type:
                type: "string"
            relationId:
                type: "integer"
                format: "int32"
        example:
            fileName: "fileName"
            size: 6
