    - "http"
paths:
    /messenger/auth:
        post:
            tags:
                - "Auth"
            summary: "The first step of signup process"
            description: "The first step of signup process"
            operationId: "messengerAuthPOST"
            consumes:
                - "application/json"
            produces:
                - "application/json"
            parameters:
                - in: "body"
                  name: "body"
                  required: true
                  schema:
                      $ref: "#/definitions/body"
            responses:
                "200":
                    description: "successful operation"
                    schema:
                        $ref: "#/definitions/inline_response_200"
                "400":
                    description: "invalid param"
            x-swagger-router-controller: "Auth"
    /messenger/auth/verify:
        post:
            tags:
                - "Auth"
            summary: "Verifiy SMS code"
            description: "Verifiy SMS code"
            operationId: "messengerAuthVerifyPOST"
            consumes:
                - "application/json"
            produces:
                - "application/json"
            parameters:
                - in: "body"
                  name: "body"
                  required: true
                  schema:
                      $ref: "#/definitions/body_1"
            responses:
                "200":
                    description: "successful operation"
                    schema:
                        $ref: "#/definitions/inline_response_200"
                "400":
                    description: "Bad request"
                "404":
                    description: "Device Not found"
                "422":
                    description: "invalid pin"
            x-swagger-router-controller: "Auth"
    /messenger/contacts:
        get:
            tags:
                - "Contact"
            summary: "Get contacts"
            description: "Get contacts"
            operationId: "messengerContactsGET"
            consumes:
                - "application/json"
            produces:
                - "application/json"
            parameters:
                - name: "keyword"
                  in: "query"
                  required: false
                  type: "string"
                - name: "page"
                  in: "query"
                  required: false
                  type: "number"
                - name: "displayName"
                  in: "query"
                  required: false
                  type: "string"
                - name: "country"
                  in: "query"
                  required: false
                  type: "string"
                - name: "gender"
                  in: "query"
                  required: false
                  type: "string"
                - name: "birthDate"
                  in: "query"
                  required: false
                  type: "string" 
            responses:
                "200":
                    description: "successful operation"
                    schema:
                        $ref: "#/definitions/inline_response_200_1"
                "400":
                    description: "invalid param"
                "403":
                    description: "invalid access token"
            x-swagger-router-controller: "Contact"
        post:
            tags:
                - "Contact"
            summary: "Update user contact."
            description: "Client sents hashed phone number list to the server."
            operationId: "messengerContactsPOST"
            consumes:
                - "application/json"
            produces:
                - "application/json"
            parameters:
                - in: "body"
                  name: "contacts"
                  required: true
                  schema:
                      type: "array"
                      items:
                          type: "string"
                      minItems: 1
                      maxItems: 500
            responses:
                "200":
                    description: "Return list of users which is already in the system"
                    schema:
                        $ref: "#/definitions/inline_response_200_2"
                "400":
                    description: "invalid param"
                "403":
                    description: "invalid access token"
            x-swagger-router-controller: "Contact"
    /messenger/contacts/all:
        get:
            tags:
                - "Contact"
            summary: "Get all contacts"
            description: "Get all contacts for team mode"
            operationId: "messengerContactsAllGET"
            consumes:
                - "application/json"
            produces:
                - "application/json"
            parameters:
                - name: "keyword"
                  in: "query"
                  required: false
                  type: "string"
                - name: "page"
                  in: "query"
                  required: false
                  type: "number"
            responses:
                "200":
                    description: "successful operation"
